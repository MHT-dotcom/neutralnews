            function setupShareButton() {

                const shareToast = document.getElementById('share-toast');

                    const currentEvent = document.querySelector('input[name="event"]').value;
                    const summary = document.querySelector('.summary-content')?.textContent;
                    
                    // Get the current URL and append the search query
                    const baseUrl = window.location.origin;
                    const shareUrl = `${baseUrl}?event=${encodeURIComponent(currentEvent)}`;
                    
                    // Check if the Web Share API is available
                    if (navigator.share) {
                        await navigator.share({
                            title: `NeutralNews: ${currentEvent}`,
                            text: summary,
                            url: shareUrl
                        });
                    } else {
                        // Fallback for browsers without Web Share API
                        copyToClipboard(shareUrl);
                    }
                });
            }
